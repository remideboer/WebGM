<!doctype html>
<html>
<head>
	<title>WebGM</title>
	<style>
		/* Color Scheme - Modulair aanpasbaar */
		:root {
			--card-bg-new: #d4edda; /* Light green */
			--card-border-new: #007bff; /* Blue */
			--card-text-new: #721c24; /* Dark red */
			--card-bg-old: #d4edda; /* Light green */
			--card-border-old: #8b4513; /* Brown */
			--card-text-old: #dc3545; /* Light red, faded */
			--card-opacity-old: 0.6; /* Fade effect */
		}

		img#canvasA, img#canvasB, img#canvasC {
			width: 100px;
			height: 100px;
			background-color: transparent;
			border: 0 !important;
			border-top: 0 !important;
			border-right: 0 !important;
			border-bottom: 0 !important;
			border-left: 0 !important;
			border-color: transparent !important;
			border-width: 0 !important;
			border-style: none !important;
			outline: none !important;
			display: inline-block;
			vertical-align: top;
		}

		#display {
			width: 100%;
			height: 300px;
			border: 1px solid #ccc;
			padding: 10px;
			overflow-y: auto;
			background-color: #fff;
			font-family: Arial, sans-serif;
		}

		.display-card {
			margin-bottom: 10px;
			padding: 12px;
			border-radius: 8px;
			word-wrap: break-word;
			transition: opacity 0.3s ease;
		}

		.display-card.new {
			background-color: var(--card-bg-new);
			border: 2px solid var(--card-border-new);
			color: var(--card-text-new);
		}

		.display-card.old {
			background-color: var(--card-bg-old);
			border: 1px solid var(--card-border-old);
			color: var(--card-text-old);
			opacity: var(--card-opacity-old);
		}
	</style>
	<script src="js-utility.js"></script>
	<script src="js-game.js"></script>
	<script src="js-general.js"></script>
	<script src="js-character.js"></script>
	<script src="js-extra.js"></script>
</head>

<body>
	<!--GameStuff-->
	<div id="display"></div>
	<img id="canvasA" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
	<img id="canvasB" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
	<img id="canvasC" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
	<br>
	<button onclick="toClipboard()">Copy text</button>
	<br>
	<button onclick="yesno()">Yes/No</button>
	<input type="range" id="ynSlider" min="1" max="19" value="10" onchange="ynShowValue(this.value)">
	<span id="chance">50% yes</span>
	<button onclick="poker()">Poker Card</button>
	<button onclick="tarot()">Tarot Card</button>
	<button onclick="displayImage()">Glyph</button>
	<br>
	<button onclick="customDice()">Roll Dice</button>
	number of dice:<input type="text" id="numDice" value="1" size="5">
	number of sides:<input type="text" id="diceSides" value="20" size="5">
	<button onclick="fudgefate()">Fate/Fudge</button>
	<br>
	<button onclick="damage()">Damage</button>
	<input type="range" id="damageSlider" min="0" max="10" value="1" onchange="damageShowValue(this.value)">
	<span id="danger">danger level 1</span>
	<br>
	 <!--General Generators:-->
	<button onclick="genre()">Genre(s)</button>
	<button onclick="eventGen()">Event</button>
	<button onclick="setting()">Setting</button>
	<button onclick="genItem()">Item</button>
	<button onclick="quest()">Quest</button>
	<button id="colorButton", onclick="colorGet()";">Color</button>
	<button onclick="animal()">Animal</button>
	<button onclick="sense()">Sense Snippet</button>
	<br>
	<!--Chatacters-->
	 <button onclick="nameGen()">Name</button>
	 <button onclick="character()">Character</button>
	 <button onclick="characteristic()">Characteristic</button>
	<button onclick="getRole()">Role</button>
	<button onclick="motivation()">Motivation</button>
	<button onclick="quirk()">Quirk</button>
	<button onclick="friend()">Friendliness</button>
	<br>

	<!--Additional-->
	<button onclick="creature()">Creature</button>
	<button onclick="magicFX()">Magical Effects</button>
	<!--Credits-->
	<br>
	<br>
	<small>Check out our <a href="https://github.com/YodraB/WebGM">GitHub Page</a> for documentation, credits, or to contribute!</small>
</body>
