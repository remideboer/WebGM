<!doctype html>
<html>
<head>
	<title>WebGM</title>
	<link rel="stylesheet" href="styles.css">
	<script src="js-utility.js"></script>
	<script src="js-game.js"></script>
	<script src="js-general.js"></script>
	<script src="js-character.js"></script>
	<script src="js-extra.js"></script>
</head>

<body>
	<!--Display groep-->
	<div class="group display-group">
		<div id="display"></div>
	</div>
	
	<!--Controle elementen groep-->
	<div class="group controls-group">
		<!--Decision & Card Generation-->
		<div class="control-subgroup" data-subgroup="decision">
			<h3 class="subgroup-header">
				<span class="subgroup-title">Decision & Card Generation</span>
				<button class="toggle-button" onclick="toggleSubgroup('decision')" aria-label="Toggle subgroup">-</button>
			</h3>
			<div class="subgroup-content">
				<button onclick="toClipboard()">Copy text</button>
				<div class="control-row">
					<label>Odds:
						<select id="oddsSelect">
							<option value="0">Certain</option>
							<option value="1">Nearly Certain</option>
							<option value="2">Very Likely</option>
							<option value="3">Likely</option>
							<option value="4" selected>50/50</option>
							<option value="5">Unlikely</option>
							<option value="6">Very Unlikely</option>
							<option value="7">Nearly Impossible</option>
							<option value="8">Impossible</option>
						</select>
					</label>
					<label>Chaos Factor:
						<input type="range" id="chaosFactor" min="1" max="9" value="5" oninput="chaosShowValue(this.value)">
						<span id="chaosValue">5</span>
					</label>
				</div>
				<div class="control-row">
					<button onclick="mythicDecision()">Yes?</button>
					<label>
						<input type="number" id="manualRoll" min="1" max="100" placeholder="1-100" size="5">
						<button onclick="mythicDecisionManual()">Submit</button>
					</label>
				</div>
				<div class="button-row">
					<button onclick="poker()">Poker Card</button>
					<button onclick="tarot()">Tarot Card</button>
					<button onclick="displayImage()">Glyph</button>
				</div>
			</div>
		</div>
		
		<!--Dice Rolling-->
		<div class="control-subgroup" data-subgroup="dice">
			<h3 class="subgroup-header">
				<span class="subgroup-title">Dice Rolling</span>
				<button class="toggle-button" onclick="toggleSubgroup('dice')" aria-label="Toggle subgroup">-</button>
			</h3>
			<div class="subgroup-content">
				<div class="control-row">
					<button onclick="customDice()">Roll Dice</button>
					<label>number of dice:<input type="text" id="numDice" value="1" size="5"></label>
					<label>number of sides:<input type="text" id="diceSides" value="20" size="5"></label>
				</div>
				<div class="button-row">
					<button onclick="fudgefate()">Fate/Fudge</button>
				</div>
			</div>
		</div>
		
		<!--Damage/Danger Level-->
		<div class="control-subgroup" data-subgroup="damage">
			<h3 class="subgroup-header">
				<span class="subgroup-title">Damage/Danger Level</span>
				<button class="toggle-button" onclick="toggleSubgroup('damage')" aria-label="Toggle subgroup">-</button>
			</h3>
			<div class="subgroup-content">
				<div class="control-row">
					<button onclick="damage()">Damage</button>
					<input type="range" id="damageSlider" min="0" max="10" value="1" oninput="damageShowValue(this.value)">
					<span id="danger">danger level 1</span>
				</div>
			</div>
		</div>
		
		<!--World/Scenario Elements-->
		<div class="control-subgroup" data-subgroup="world">
			<h3 class="subgroup-header">
				<span class="subgroup-title">World/Scenario Elements</span>
				<button class="toggle-button" onclick="toggleSubgroup('world')" aria-label="Toggle subgroup">-</button>
			</h3>
			<div class="subgroup-content">
				<div class="button-row">
					<button onclick="genre()">Genre(s)</button>
					<button onclick="eventGen()">Event</button>
					<button onclick="setting()">Setting</button>
				</div>
				<div class="button-row">
					<button onclick="genItem()">Item</button>
					<button onclick="quest()">Quest</button>
					<button id="colorButton", onclick="colorGet()";">Color</button>
				</div>
				<div class="button-row">
					<button onclick="animal()">Animal</button>
					<button onclick="sense()">Sense Snippet</button>
				</div>
			</div>
		</div>
		
		<!--Character Elements-->
		<div class="control-subgroup" data-subgroup="character">
			<h3 class="subgroup-header">
				<span class="subgroup-title">Character Elements</span>
				<button class="toggle-button" onclick="toggleSubgroup('character')" aria-label="Toggle subgroup">-</button>
			</h3>
			<div class="subgroup-content">
				<div class="button-row">
					<button onclick="nameGen()">Name</button>
					<button onclick="character()">Character</button>
					<button onclick="characteristic()">Characteristic</button>
				</div>
				<div class="button-row">
					<button onclick="getRole()">Role</button>
					<button onclick="motivation()">Motivation</button>
					<button onclick="quirk()">Quirk</button>
				</div>
				<div class="control-row">
					<button onclick="friend()">Friendliness</button>
					<label>
						<span>friendly</span>
						<input type="range" id="friendlinessSlider" min="-4" max="4" value="0">
						<span>hostile</span>
					</label>
				</div>
			</div>
		</div>
		
		<!--Creature & Magical Elements-->
		<div class="control-subgroup" data-subgroup="creature">
			<h3 class="subgroup-header">
				<span class="subgroup-title">Creature & Magical Elements</span>
				<button class="toggle-button" onclick="toggleSubgroup('creature')" aria-label="Toggle subgroup">-</button>
			</h3>
			<div class="subgroup-content">
				<div class="button-row">
					<button onclick="creature()">Creature</button>
					<button onclick="magicFX()">Magical Effects</button>
				</div>
			</div>
		</div>
	</div>
	
	<!--Footer-->
	<footer class="footer">
		<div class="footer-content">
			<div class="footer-line">original: <a href="https://github.com/YodraB/WebGM">https://github.com/YodraB/WebGM</a></div>
			<div class="footer-line">this: <a href="https://github.com/remideboer/WebGM">https://github.com/remideboer/WebGM</a></div>
		</div>
	</footer>
	
	<!--Message notification-->
	<div id="message-notification" class="message-notification"></div>
</body>
